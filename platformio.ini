; ESP32-S3 DevKitC-1 N16R8 (16 MB flash, 8 MB octal PSRAM) - Phase 1 capture logger
;
; Two environments:
;   uart       -> Serial comes out of the port labelled "UART" (USB-to-serial chip). DEFAULT.
;   native-usb -> Serial comes out of the port labelled "USB" (the S3's own USB).
; Plug the cable into the port that matches the env you flash/monitor with.

[platformio]
default_envs = uart

[env]
platform = espressif32@8.0.0   ; pinned: the version this was built and compile-tested with
board = esp32-s3-devkitc-1
framework = arduino

; --- N16R8 memory layout ---
; qio_opi = quad-SPI flash + OCTAL PSRAM. That is why GPIO 35-37 are off limits.
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

; Fast serial so a session dump doesn't take minutes. If the monitor shows garbage
; (apart from the ROM boot banner, which is always 115200), drop this to 115200 here
; AND in include/config.h (SERIAL_BAUD).
monitor_speed = 921600

lib_deps =
    olikraus/U8g2@^2.35.19
    h2zero/NimBLE-Arduino@2.5.2

build_flags =
    -DBOARD_HAS_PSRAM
    ; BLE is observer-only: the roles that could advertise or connect are compiled out
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCORE_DEBUG_LEVEL=0
    ; Unit label that ends up in the session header. Change per board: A, B, C.
    -DUNIT_ID=\"A\"

[env:uart]
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0

[env:native-usb]
; Over the S3's own USB, the default post-flash reset can leave the chip sitting in the
; bootloader. A watchdog reset always starts the new firmware.
board_upload.after_reset = watchdog-reset
; Opening the monitor must not toggle the lines that reset the chip over native USB.
monitor_dtr = 0
monitor_rts = 0
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
